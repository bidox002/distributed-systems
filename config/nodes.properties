# Shared five-laptop directory. Replace every 192.168.0.x value with the
# current Wi-Fi IPv4 address of the laptop that hosts the listed node pair.
# All five laptops must use the identical completed file before the demo.
# Nodes wait this long before each token hand-off; increase it for slower, more visible circulation.
token.handoff.delay.ms=750

# Laptop A: Nodes 0 and 1
node.0.host=192.168.174.198
node.0.port=8000
node.1.host=192.168.174.198
node.1.port=8001

# Laptop B: Nodes 2 and 3
node.2.host=192.168.174.198
node.2.port=8002
node.3.host=192.168.174.198
node.3.port=8003

# Laptop C: Nodes 4 and 5
node.4.host=192.168.174.198
node.4.port=8004
node.5.host=192.168.174.198
node.5.port=8005

# Laptop D: Nodes 6 and 7. Their host addresses should match; verify the current
# Laptop D Wi-Fi IP before running because these two entries currently differ.
node.6.host=192.168.174.198
node.6.port=8006
node.7.host=192.168.174.198
node.7.port=8007

# Laptop E: Nodes 8 and 9
node.8.host=192.168.174.198
node.8.port=8008
node.9.host=192.168.174.198
